# SonarQube Project Configuration
# This file contains sample configuration for SonarQube analysis
# Configure these properties according to your project needs

# Project identification
sonar.projectKey=dbv-spring-boot-starter
sonar.projectName=DBV Spring Boot Starter
sonar.projectVersion=1.0

# Source code location
sonar.sources=src/main/java
sonar.tests=src/test/java

# Java version
sonar.java.source=21
sonar.java.target=21

# Encoding of source files
sonar.sourceEncoding=UTF-8

# Coverage exclusions (if needed)
# sonar.coverage.exclusions=**/*Test.java,**/*IT.java

# Additional properties
# sonar.host.url=http://localhost:9000
# sonar.login=your-token-here
